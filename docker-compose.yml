services:
    yasmine-frontend:
        container_name: yasmine-frontend
        build: frontend
        image: yasmine/frontend
#        platform: linux/arm64 # for MacOS M1+ users
        ports:
            - "1841:1841"   
        volumes:
            - ./:/code
        networks:
            - yasmine
    yasmine-backend:
        container_name: yasmine-backend
        build: backend
        image: yasmine/backend
#        platform: linux/amd64 # for MacOS M1+ users
        ports:
            - "8080:80"
        environment:
            YASMINE_DEBUG: "0"
        healthcheck:
            test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1/healthz')"]
            interval: 30s
            timeout: 5s
            retries: 5
            start_period: 40s
        volumes:
            - ./data:/opt/yasmine/data
            - ./backend:/opt/yasmine/src
            - ./.git:/opt/yasmine/.git:ro  
        networks:
            - yasmine             
        stdin_open: true
        tty: true        
networks: 
    yasmine:
